name: Deploy to VPS

# Every push to master forces the VPS's working copy to exactly match this
# commit (git reset --hard), then rebuilds and restarts the stack -- any
# uncommitted changes made directly on the VPS will be lost on the next
# deploy. The VPS is meant to be a deploy target now, not a place to hand-edit.
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Default is 10m. The backend image builds the local embedding
          # model's onnxruntime dependency and takes ~6min to build plus
          # ~3.5min to export, so the default silently killed the session
          # mid-deploy -- twice -- leaving the OLD container running while
          # the repo sat on the new commit.
          command_timeout: 30m
          script: |
            set -e
            cd /home/botimi/botimi
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build
            # `up -d --build` does not reliably swap the container: compose
            # has repeatedly reported "Running" and left the old one in
            # place even though the build produced a new image id (buildx's
            # containerd store rewrites the id on every build via
            # attestation manifests, which compose's own staleness check
            # does not always notice). That is how stale code reached
            # production twice. The health check below cannot catch it
            # either -- a stale container answers /api/health perfectly
            # happily. So: compare image ids, force the swap if they differ,
            # and only then trust it.
            BUILT=$(docker image inspect -f '{{.Id}}' botimi-backend:latest)
            if [ "$(docker inspect -f '{{.Image}}' botimi-backend-1)" != "$BUILT" ]; then
              echo "Backend is on a stale image -- forcing recreate."
              docker compose up -d --force-recreate --no-deps backend
            fi
            if [ "$(docker inspect -f '{{.Image}}' botimi-backend-1)" != "$BUILT" ]; then
              echo "Backend STILL not running the freshly built image -- deploy did not take effect."
              exit 1
            fi
            sleep 5
            curl -sf https://app.botimi.co.zw/api/health
