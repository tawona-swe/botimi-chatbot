name: Deploy to VPS

# Every push to master forces the VPS's working copy to exactly match this
# commit (git reset --hard), then rebuilds and restarts the stack -- any
# uncommitted changes made directly on the VPS will be lost on the next
# deploy. The VPS is meant to be a deploy target now, not a place to hand-edit.
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/botimi/botimi
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build
            sleep 5
            curl -sf https://app.botimi.co.zw/api/health
