# Pinned explicitly rather than left to default to the clone directory's
# name -- the shared infra/edge/Caddyfile references containers as
# "botimi-backend-1" / "botimi-frontend-1" (Compose's
# <project>-<service>-<n> naming), which only stays correct if this project
# is always named "botimi" regardless of what folder someone happens to
# clone it into.
name: botimi

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/botimi.db
    volumes:
      # Named volume, not a bind mount to a path in the repo -- survives
      # `docker compose down`, image rebuilds, and `git pull`s. It is NOT
      # survived by `docker compose down -v` (the -v deletes named volumes
      # too) -- never run that here without a fresh Litestream restore or a
      # manual backup in hand first.
      - botimi_data:/app/data
    # Not exposed to the host at all -- only reachable by other containers
    # on the shared "edge" network (this VPS's one Caddy instance, defined
    # in infra/edge -- see that directory's own README), never directly
    # from the internet.
    expose:
      - "3001"
    networks:
      - edge

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time (see next.config.mjs
        # and lib/api.js) -- must be the real public URL, set in .env.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:3001
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - edge

  # Continuous replication of the live SQLite file to S3-compatible object
  # storage -- real point-in-time durability without waiting on a Postgres
  # migration. Reads the same volume backend writes to; does not modify the
  # database itself, only tails its WAL. If LITESTREAM_* vars are left
  # blank, this container will just fail to authenticate and restart-loop --
  # that's a visible, safe failure (docker compose logs litestream), not a
  # silent one, but it does mean backups aren't running until configured.
  litestream:
    image: litestream/litestream:0.5
    restart: unless-stopped
    volumes:
      - botimi_data:/app/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-us-east-1}
    command: ["replicate"]
    depends_on:
      - backend
    # No network needed at all -- litestream only touches the shared
    # volume on disk, never talks to backend/frontend/Caddy over the
    # network.

networks:
  edge:
    external: true
    # Created by infra/edge/docker-compose.yml, which must be deployed
    # first -- `docker compose up` here fails with a clear "network edge
    # declared as external, but could not be found" error otherwise, not a
    # silent problem.

volumes:
  botimi_data:
