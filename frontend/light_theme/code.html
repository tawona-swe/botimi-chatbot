<script>
        // Subtle micro-interactions
        document.querySelectorAll('.custom-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').style.color = '#4648d4';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').style.color = '';
            });
        });

        // Toggle password visibility
        const eyeIcon = document.querySelector('.material-symbols-outlined.absolute');
        const passInput = document.querySelector('input[type="password"]');
        if (eyeIcon && passInput) {
            eyeIcon.addEventListener('click', () => {
                const isPass = passInput.getAttribute('type') === 'password';
                passInput.setAttribute('type', isPass ? 'text' : 'password');
                eyeIcon.textContent = isPass ? 'visibility_off' : 'visibility';
            });
        }
    </script>
